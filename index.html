<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？ - 智慧餐飲選擇器</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- App CSS -->
    <link rel="stylesheet" href="style.css?v=1.0.3">
    <!-- Inline override to prevent Safari layout caching issues -->
    <style>
        .app-container {
            display: block !important;
            position: relative !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            pointer-events: none !important;
        }
    </style>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <!-- 全螢幕背景地圖 -->
    <div id="map-container" class="map-background"></div>
    
    <!-- 地圖深色玻璃模糊遮罩 -->
    <div id="map-overlay" class="map-overlay"></div>

    <div class="app-container">
        <!-- Top Floating Header -->
        <header class="floating-header">
            <div class="logo">
                <i data-lucide="utensils-crossed" class="logo-icon"></i>
                <h1>今天吃什麼？</h1>
            </div>
            <span class="date-badge" id="current-date">Sunday, June 14</span>
        </header>

        <!-- Right Side Slide Drawer (Sidebar) -->
        <aside id="sidebar-drawer" class="sidebar-drawer">
            <div class="drawer-header">
                <div class="drawer-title">
                    <i data-lucide="bookmark-heart" style="color: #f43f5e;"></i>
                    <h2>口袋清單</h2>
                    <span id="restaurant-count" class="count-badge">0</span>
                </div>
                <button id="close-drawer-btn" class="drawer-close-btn">&times;</button>
            </div>
            
            <div class="drawer-actions">
                <button id="add-restaurant-btn" class="btn btn-secondary btn-full">
                    <i data-lucide="plus"></i> 新增餐廳
                </button>
            </div>
            
            <div id="restaurant-list" class="restaurant-list">
                <!-- JS will populate restaurant items here -->
                <div class="empty-state">
                    <i data-lucide="store" class="empty-icon"></i>
                    <p>你的口袋清單空空如也</p>
                    <button id="load-defaults-btn" onclick="loadDefaults()" class="btn btn-sm btn-outline">載入推薦預設餐廳</button>
                </div>
            </div>
        </aside>

        <!-- Center Stage: Roulette Wheel -->
        <div id="wheel-stage" class="wheel-stage">
            <div class="roulette-wrapper">
                <div class="canvas-holder">
                    <div class="wheel-pointer"></div>
                    <canvas id="roulette-canvas" width="380" height="380"></canvas>
                    <canvas id="particle-canvas" width="800" height="800"></canvas>
                </div>
                <div class="roulette-controls">
                    <button id="spin-btn" class="btn btn-primary btn-lg btn-glow">
                        <i data-lucide="dices"></i> 開始旋轉！
                    </button>
                </div>
            </div>
        </div>

        <!-- Floating Controls (Top Right) -->
        <div class="floating-controls">
            <button id="show-wheel-btn" class="btn btn-glass btn-icon-only show-wheel-btn" title="返回輪盤">
                <i data-lucide="dices"></i>
            </button>
            <button id="toggle-drawer-btn" class="btn btn-glass btn-icon-only" title="開啟口袋清單">
                <i data-lucide="menu"></i>
            </button>
        </div>

        <!-- Bottom Slide-up Winner Card -->
        <div id="winner-slide-card" class="winner-slide-card glassmorphism-dark hidden">
            <button id="close-winner-card-btn" class="winner-card-close-btn">&times;</button>
            <div class="result-badge"><i data-lucide="sparkles"></i> 恭喜抽中 <i data-lucide="sparkles"></i></div>
            <h2 id="result-title">餐廳名稱</h2>
            <div class="result-details">
                <span id="result-cuisine" class="badge">料理類型</span>
                <span id="result-price" class="price-indicator">$$</span>
                <span id="result-rating" class="stars">⭐⭐⭐⭐</span>
            </div>
            <p id="result-address" class="result-address"><i data-lucide="map-pin"></i> 台北市信義區</p>
            <p id="result-notes" class="result-notes">"這裡顯示備忘筆記..."</p>
            
            <div class="result-actions">
                <a id="result-order-btn" href="#" target="_blank" class="btn btn-primary btn-sm hidden">
                    <i data-lucide="shopping-cart"></i> 線上點餐
                </a>
                <button id="result-share-btn" class="btn btn-secondary btn-sm">
                    <i data-lucide="smartphone"></i> 傳送至手機
                </button>
                <button id="respin-btn" class="btn btn-outline btn-sm">
                    <i data-lucide="refresh-cw"></i> 再抽一次
                </button>
            </div>
        </div>
    </div>

    <!-- Modal 1: Add/Edit Restaurant Form -->
    <div id="restaurant-modal" class="modal">
        <div class="modal-content glassmorphism">
            <div class="modal-header">
                <h3 id="modal-title">新增口袋美食</h3>
                <button class="close-btn" data-modal="restaurant-modal">&times;</button>
            </div>
            <form id="restaurant-form" class="modal-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="rt-name">餐廳名稱 <span class="required">*</span></label>
                    <input type="text" id="rt-name" required placeholder="例如：好正點港式點心" class="form-input">
                </div>
                <div class="form-group">
                    <label for="rt-cuisine">料理類型/標籤</label>
                    <input type="text" id="rt-cuisine" placeholder="例如：日式, 拉麵, 午餐" class="form-input">
                </div>
                
                <button type="button" id="toggle-advanced-btn" class="btn-toggle-advanced">展開進階設定 ▾</button>
                
                <!-- Advanced fold-away fields -->
                <div id="advanced-form-fields" class="advanced-form-fields">
                    <div class="form-row">
                        <div class="form-group flex-1">
                            <label for="rt-price">價格區間</label>
                            <select id="rt-price" class="form-select">
                                <option value="1">$ (平價)</option>
                                <option value="2">$$ (中等)</option>
                                <option value="3">$$$ (高檔)</option>
                            </select>
                        </div>
                        <div class="form-group flex-1">
                            <label for="rt-rating">美味評分</label>
                            <div class="star-rating">
                                <input type="radio" name="rating" id="star-5" value="5"><label for="star-5">★</label>
                                <input type="radio" name="rating" id="star-4" value="4"><label for="star-4">★</label>
                                <input type="radio" name="rating" id="star-3" value="3" checked><label for="star-3">★</label>
                                <input type="radio" name="rating" id="star-2" value="2"><label for="star-2">★</label>
                                <input type="radio" name="rating" id="star-1" value="1"><label for="star-1">★</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="rt-latlng">地圖座標 (選填)</label>
                        <div class="coords-input-wrapper">
                            <input type="text" id="rt-latlng" placeholder="緯度, 經度 (例如: 25.04, 121.51)" class="form-input">
                            <button type="button" id="pick-coords-btn" class="btn btn-xs btn-outline" title="使用地圖選取點">地圖選取</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="rt-address">地址 / 位置說明</label>
                        <input type="text" id="rt-address" placeholder="例如：台北市信義區松壽路 12 號" class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="rt-link">線上點餐 / 官網連結</label>
                        <input type="url" id="rt-link" placeholder="例如：https://www.ubereats.com/... 或 https://togo.inline.app/..." class="form-input">
                    </div>
                    <div class="form-group">
                        <label for="rt-notes">私房備忘錄</label>
                        <textarea id="rt-notes" placeholder="必點菜色、小菜免費、人多需排隊..." class="form-input" rows="2"></textarea>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline close-btn" data-modal="restaurant-modal">取消</button>
                    <button type="submit" class="btn btn-primary">儲存餐廳</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Modal 2: Share / Send to Phone Panel -->
    <div id="share-modal" class="modal">
        <div class="modal-content glassmorphism">
            <div class="modal-header">
                <h3>傳送餐廳至手機</h3>
                <button class="close-btn" data-modal="share-modal">&times;</button>
            </div>
            <div class="share-modal-body">
                <div class="qr-code-section" id="qr-code-section">
                    <div class="qr-code-wrapper">
                        <div class="qr-code-shimmer" id="qr-shimmer"></div>
                        <img id="qr-code-img" src="" alt="QR Code" class="hidden">
                    </div>
                    <p class="qr-instruction">手機相機掃描，立即導航地圖</p>
                </div>
                
                <div class="share-options">
                    <button id="share-native-btn" class="btn btn-secondary btn-full hidden">
                        <i data-lucide="share-2"></i> 系統原生分享
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
